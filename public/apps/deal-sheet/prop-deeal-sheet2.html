document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

9C7A24;\n    --amber-bg:#F0E4C4;\n    --loss:#A13D2C;\n    --loss-bg:#F1DAD3;\n    --focus:#34506B;\n  }\n\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;background:var(--parchment);}\n  body{\n    font-family:'Source Sans Pro',sans-serif;\n    color:var(--ink);\n    padding:20px 20px 50px;\n    -webkit-font-smoothing:antialiased;\n  }\n  .page{max-width:1260px;margin:0 auto;}\n\n  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;}\n\n  .top-header{\n    display:flex;\n    justify-content:space-between;\n    align-items:flex-start;\n    gap:16px;\n    margin-bottom:20px;\n  }\n  .eyebrow{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    letter-spacing:.14em;\n    text-transform:uppercase;\n    color:var(--slate);\n    margin:0 0 6px;\n  }\n  h1{\n    font-family:'Sora','Source Sans Pro',sans-serif;\n    font-weight:600;\n    font-size:clamp(26px,4.5vw,38px);\n    margin:0;\n    letter-spacing:-0.01em;\n  }\n  @media (max-width:480px){\n    body{padding:16px 14px 40px;}\n  }\n\n  .drawer-toggle{\n    display:flex;\n    align-items:center;\n    gap:8px;\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:2px;\n    padding:10px 14px;\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    letter-spacing:.08em;\n    text-transform:uppercase;\n    color:var(--slate);\n    cursor:pointer;\n    white-space:nowrap;\n    margin-top:2px;\n  }\n  .drawer-toggle:hover{border-color:var(--slate-soft);}\n  .drawer-toggle svg{transition:transform .25s ease;}\n  .drawer-toggle.expanded svg{transform:rotate(180deg);}\n\n  .body-row{\n    display:flex;\n    gap:24px;\n    align-items:flex-start;\n    justify-content:center;\n  }\n  .wrap{max-width:920px;width:100%;flex:1 1 480px;min-width:0;}\n\n  .panel{\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:3px;\n    padding:22px;\n    margin-bottom:18px;\n  }\n\n  .inputs-row{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:16px;\n  }\n  @media (max-width:520px){ .inputs-row{grid-template-columns:1fr;} }\n\n  label{\n    display:block;\n    font-size:11.5px;\n    font-family:'JetBrains Mono',monospace;\n    letter-spacing:.06em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n    margin-bottom:6px;\n  }\n  .field{position:relative;}\n  .field .prefix{\n    position:absolute;\n    left:14px; top:50%;\n    transform:translateY(-50%);\n    color:var(--ink-soft);\n    font-family:'JetBrains Mono',monospace;\n    font-size:22px;\n    pointer-events:none;\n  }\n  input.amount-input{\n    width:100%;\n    font-family:'JetBrains Mono',monospace;\n    font-size:26px;\n    padding:16px 14px 16px 34px;\n    border:1px solid var(--line);\n    border-radius:2px;\n    background:#fff;\n    color:var(--ink);\n  }\n  input.amount-input:focus{border-color:var(--slate);}\n  input.amount-input[readonly]{background:#fff;color:var(--ink);}\n\n  .hint{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    color:var(--ink-soft);\n    margin-top:6px;\n  }\n  @media (max-width:380px){\n    input.amount-input{font-size:21px;padding:14px 12px 14px 30px;}\n    .field .prefix{font-size:18px;left:12px;}\n  }\n\n  /* drawer */\n  .drawer{\n    width:300px;\n    flex:0 0 300px;\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:3px;\n    padding:20px;\n    overflow:hidden;\n    transition:width .25s ease, flex-basis .25s ease, padding .25s ease, border-color .25s ease, opacity .2s ease;\n  }\n  .drawer.collapsed{\n    width:0;\n    flex:0 0 0;\n    padding:20px 0;\n    border-color:transparent;\n    opacity:0;\n  }\n  .drawer-title-row{\n    display:flex;\n    align-items:center;\n    justify-content:space-between;\n    gap:10px;\n    margin-bottom:16px;\n  }\n  .drawer-title{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    letter-spacing:.08em;\n    text-transform:uppercase;\n    color:var(--slate);\n    margin:0;\n    white-space:nowrap;\n  }\n  .your-inputs-toggle{\n    display:flex;\n    align-items:center;\n    gap:6px;\n    font-family:'JetBrains Mono',monospace;\n    font-size:10.5px;\n    letter-spacing:.05em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n    cursor:pointer;\n    white-space:nowrap;\n  }\n  .your-inputs-toggle input{\n    appearance:none;\n    -webkit-appearance:none;\n    width:13px;\n    height:13px;\n    border:1.5px solid var(--ink);\n    background:#fff;\n    border-radius:1px;\n    cursor:pointer;\n    position:relative;\n    margin:0;\n  }\n  .your-inputs-toggle input:checked::after{\n    content:'';\n    position:absolute;\n    inset:2px;\n    background:var(--ink);\n  }\n  .type-size-select{\n    width:100%;\n    font-family:'JetBrains Mono',monospace;\n    font-size:13px;\n    padding:7px 8px;\n    border:1px solid var(--line);\n    border-radius:2px;\n    background:#fff;\n    color:var(--ink);\n  }\n  .a-group{margin-bottom:20px;}\n  .a-group:last-child{margin-bottom:0;}\n  .a-group-label{\n    font-family:'JetBrains Mono',monospace;\n    font-size:10.5px;\n    letter-spacing:.1em;\n    text-transform:uppercase;\n    color:var(--slate-soft);\n    margin:0 0 10px;\n    padding-bottom:6px;\n    border-bottom:1px solid var(--line);\n    white-space:nowrap;\n  }\n  .a-field{margin-bottom:14px;}\n  .a-field:last-child{margin-bottom:0;}\n  .a-field label{margin-bottom:4px;}\n  .a-field .row{display:flex;align-items:center;gap:8px;}\n  .a-field input[type=range]{flex:1;accent-color:var(--slate);}\n  .a-field .val{\n    font-family:'JetBrains Mono',monospace;\n    font-size:13px;\n    min-width:44px;\n    text-align:right;\n    color:var(--ink);\n  }\n\n  /* summary card */\n  .summary-head{\n    display:flex; justify-content:center; align-items:baseline;\n    margin-bottom:14px; flex-wrap:wrap; gap:8px;\n  }\n  .verdict{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;\n    letter-spacing:.08em;\n    text-transform:uppercase;\n    padding:5px 10px;\n    border-radius:2px;\n    border:1px solid transparent;\n  }\n  .verdict.profit{background:var(--profit-bg);color:var(--profit);border-color:var(--profit);}\n  .verdict.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber);}\n  .verdict.loss{background:var(--loss-bg);color:var(--loss);border-color:var(--loss);}\n\n  .metrics{\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    gap:1px;\n    background:var(--line);\n    border:1px solid var(--line);\n  }\n  @media (max-width:640px){ .metrics{grid-template-columns:1fr 1fr;} }\n  .metric{background:var(--panel);padding:14px 16px;}\n  .metric-slider{\n    width:100%;\n    margin-top:10px;\n    accent-color:var(--slate);\n  }\n  .metric .m-label{\n    font-family:'JetBrains Mono',monospace;\n    font-size:10.5px;\n    letter-spacing:.06em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n    margin-bottom:5px;\n  }\n  .tip{\n    position:relative;\n    display:inline-block;\n    border-bottom:1px dashed var(--ink-soft);\n    cursor:help;\n  }\n  .tip::after{\n    content:attr(data-tip);\n    position:absolute;\n    left:0;\n    bottom:calc(100% + 8px);\n    width:220px;\n    max-width:60vw;\n    background:var(--ink);\n    color:var(--panel);\n    font-family:'Source Sans Pro',sans-serif;\n    font-size:12px;\n    font-weight:400;\n    text-transform:none;\n    letter-spacing:normal;\n    line-height:1.45;\n    padding:10px 12px;\n    border-radius:2px;\n    opacity:0;\n    visibility:hidden;\n    transition:opacity .15s ease;\n    z-index:20;\n    pointer-events:none;\n  }\n  .tip:hover::after{opacity:1;visibility:visible;}\n  .metric .m-val{\n    font-family:'JetBrains Mono',monospace;\n    font-weight:600;\n  }\n\n  /* grid */\n  .grid-title{\n    font-family:'Playfair Display',serif;\n    font-weight:600;\n    font-size:18px;\n    margin:0 0 3px;\n  }\n  .grid-note{\n    font-size:13px;\n    color:var(--ink-soft);\n    margin:0 0 16px;\n    line-height:1.5;\n  }\n  .grid-scroll{overflow-x:auto;padding-bottom:4px;}\n  table.heatmap{\n    border-collapse:collapse;\n    width:100%;\n    min-width:640px;\n    font-family:'JetBrains Mono',monospace;\n  }\n  table.heatmap th, table.heatmap td{\n    text-align:center;\n    padding:0;\n    font-size:1em;\n  }\n  .corner{\n    background:var(--panel);\n    border:1px solid var(--line);\n  }\n  .axis-label{\n    font-family:'JetBrains Mono',monospace;\n    font-size:10px;\n    letter-spacing:.08em;\n    text-transform:uppercase;\n    color:var(--ink-soft);\n  }\n  .col-head, .row-head{\n    background:var(--panel);\n    border:1px solid var(--line);\n    color:var(--ink-soft);\n    font-weight:500;\n    padding:8px 6px;\n    white-space:nowrap;\n  }\n  .row-head{text-align:right;padding-right:10px;}\n  td.cell{\n    border:1px solid var(--line);\n    padding:10px 4px;\n    position:relative;\n    cursor:default;\n  }\n  td.cell .cv{font-weight:600;font-size:1.04em;}\n  td.cell.hit{\n    box-shadow: inset 0 0 0 2px var(--ink);\n  }\n  td.cell.break-top{ border-top:3px solid var(--ink); }\n  td.cell.break-left{ border-left:3px solid var(--ink); }\n\n  .legend{\n    display:flex; align-items:center; gap:18px; flex-wrap:wrap;\n    margin-top:16px; font-size:12px; color:var(--ink-soft);\n  }\n  .legend .sw{display:inline-flex;align-items:center;gap:6px;}\n  .legend .chip{width:13px;height:13px;border-radius:2px;display:inline-block;}\n\n  footer{\n    margin-top:24px;\n    font-size:12px;\n    color:var(--ink-soft);\n    line-height:1.6;\n    border-top:1px solid var(--line);\n    padding-top:14px;\n  }\n\n  @media (max-width:1260px){\n    .body-row{flex-wrap:wrap;}\n    .wrap{flex:1 1 100%;}\n    .drawer{flex:1 1 100%;width:100%;}\n    .drawer.collapsed{display:none;width:auto;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n  <div class=\"top-header\">\n    <div>\n      <p class=\"eyebrow\">Profitability Lookup<\u002Fp>\n      <h1>Property Deal Sheet<\u002Fh1>\n    <\u002Fdiv>\n    <button class=\"drawer-toggle expanded\" id=\"drawerToggle\" aria-expanded=\"true\">\n      <span id=\"drawerToggleLabel\">Assumptions<\u002Fspan>\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n        <path d=\"M9 2.5L4.5 7L9 11.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"body-row\">\n    <div class=\"wrap\">\n      <div class=\"panel\">\n        <div class=\"inputs-row\">\n          <div>\n            <label for=\"price\" class=\"tip\" data-tip=\"The purchase price you'd pay for the property. Drives loan size and every downstream metric. Example: a $300,000 duplex.\">Property list price<\u002Flabel>\n            <div class=\"field\">\n              <span class=\"prefix\">$<\u002Fspan>\n              <input type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" class=\"amount-input\" id=\"price\" value=\"300,000\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label for=\"income\" class=\"tip\" data-tip=\"Gross rent collected each month, an observed fact about the property. Example: $3,500/mo on a $300,000 property.\">Monthly income<\u002Flabel>\n            <div class=\"field\">\n              <span class=\"prefix\">$<\u002Fspan>\n              <input type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" class=\"amount-input\" id=\"income\" value=\"3,500\">\n            <\u002Fdiv>\n            <div class=\"hint\" id=\"incomeAnnualHint\">Annual: $42,000/yr<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"panel\">\n        <div class=\"summary-head\">\n          <span class=\"verdict\" id=\"verdict\">—<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"metrics\">\n          <div class=\"metric\">\n            <div class=\"m-label tip\" data-tip=\"Annual pre-tax cash flow ÷ cash invested (down payment). Shows the return on your actual cash outlay. Example: 8% CoC means $8,000/yr on a $100,000 down payment.\">Cash-on-cash return<\u002Fdiv>\n            <div class=\"m-val\" id=\"mCoC\">—<\u002Fdiv>\n            <input type=\"range\" class=\"metric-slider\" id=\"mCoCSlider\" min=\"0\" max=\"60\" step=\"1\" value=\"20\">\n          <\u002Fdiv>\n          <div class=\"metric\">\n            <div class=\"m-label tip\" data-tip=\"Net operating income ÷ property price, ignoring financing. Lets you compare deals independent of how they're financed. Example: a 6% cap rate on a $300,000 property.\">Cap rate<\u002Fdiv>\n            <div class=\"m-val\" id=\"mCap\">—<\u002Fdiv>\n            <input type=\"range\" class=\"metric-slider\" id=\"mCapSlider\" min=\"0\" max=\"80\" step=\"1\" value=\"40\">\n          <\u002Fdiv>\n          <div class=\"metric\">\n            <div class=\"m-label tip\" data-tip=\"Debt Service Coverage Ratio: NOI ÷ annual mortgage payments. Shows if income covers the loan. Example: 1.25x means income exceeds debt payments by 25%.\">DSCR<\u002Fdiv>\n            <div class=\"m-val\" id=\"mDscr\">—<\u002Fdiv>\n            <input type=\"range\" class=\"metric-slider\" id=\"mDscrSlider\" min=\"0\" max=\"15\" step=\"0.125\" value=\"6\">\n          <\u002Fdiv>\n          <div class=\"metric\">\n            <div class=\"m-label tip\" data-tip=\"Monthly income left after expenses and mortgage payment. The actual cash in your pocket each month. Example: $250/mo positive cash flow.\">Monthly cash flow<\u002Fdiv>\n            <div class=\"m-val\" id=\"mCF\">—<\u002Fdiv>\n            <input type=\"range\" class=\"metric-slider\" id=\"mCFSlider\" min=\"500\" max=\"10000\" step=\"50\" value=\"3500\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"grid-scroll\" style=\"margin-top:18px;\">\n          <table class=\"heatmap\" id=\"heatmap\"><\u002Ftable>\n        <\u002Fdiv>\n        <div class=\"legend\">\n          <span class=\"sw\"><span class=\"chip\" style=\"background:var(--loss-bg);border:1px solid var(--loss);\"><\u002Fspan>Negative return<\u002Fspan>\n          <span class=\"sw\"><span class=\"chip\" style=\"background:var(--amber-bg);border:1px solid var(--amber);\"><\u002Fspan><span id=\"legendMid\">0–8% return<\u002Fspan><\u002Fspan>\n          <span class=\"sw\"><span class=\"chip\" style=\"background:var(--profit-bg);border:1px solid var(--profit);\"><\u002Fspan><span id=\"legendHigh\">8%+ return<\u002Fspan><\u002Fspan>\n          <span class=\"sw\"><span class=\"chip\" style=\"background:#fff;border:2px solid var(--ink);\"><\u002Fspan>Your inputs<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <footer>\n        Figures are illustrative estimates based on the parameters in the drawer (down payment, operating expense ratio, interest rate, loan term) and standard mortgage amortization. They don't account for closing costs, vacancy, capex reserves, taxes on income, or financing terms specific to you. This isn't financial or investment advice — confirm numbers with a lender or advisor before acting on them.\n      <\u002Ffooter>\n    <\u002Fdiv>\n\n    <aside class=\"drawer expanded\" id=\"drawer\">\n      <div class=\"drawer-title-row\">\n        <p class=\"drawer-title\">Assumptions<\u002Fp>\n        <label class=\"your-inputs-toggle\" for=\"showYourInputs\">\n          <input type=\"checkbox\" id=\"showYourInputs\" checked=\"\">\n          Your inputs\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div class=\"a-group\">\n        <p class=\"a-group-label\">Loan terms<\u002Fp>\n        <div class=\"a-field\">\n          <label for=\"down\">Down payment<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"down\" min=\"0\" max=\"60\" step=\"1\" value=\"20\">\n            <span class=\"val\" id=\"downVal\">20%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"a-field\">\n          <label for=\"rate\">Mortgage rate<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"rate\" min=\"0\" max=\"15\" step=\"0.125\" value=\"6\">\n            <span class=\"val\" id=\"rateVal\">6.00%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"a-field\">\n          <label for=\"term\">Loan term<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"term\" min=\"10\" max=\"40\" step=\"5\" value=\"30\">\n            <span class=\"val\" id=\"termVal\">30 yr<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a-group\">\n        <p class=\"a-group-label\">Expenses<\u002Fp>\n        <div class=\"a-field\">\n          <label for=\"expense\">Operating expenses<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"expense\" min=\"0\" max=\"80\" step=\"1\" value=\"40\">\n            <span class=\"val\" id=\"expenseVal\">40%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a-group\">\n        <p class=\"a-group-label\">Income<\u002Fp>\n        <div class=\"a-field\">\n          <label for=\"incomePct\">Operating income (derived)<\u002Flabel>\n          <div class=\"row\">\n            <span class=\"val\" id=\"incomePctVal\" style=\"min-width:auto;\">14.0% of price / yr<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a-group\">\n        <p class=\"a-group-label\">Layout<\u002Fp>\n        <div class=\"a-field\">\n          <label for=\"rangePct\">Grid range (each way)<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"rangePct\" min=\"5\" max=\"40\" step=\"5\" value=\"15\">\n            <span class=\"val\" id=\"rangePctVal\">15%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"a-field\">\n          <label for=\"stepsCount\">Grid steps per side<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"stepsCount\" min=\"1\" max=\"5\" step=\"1\" value=\"3\">\n            <span class=\"val\" id=\"stepsCountVal\">3<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"a-field\">\n          <label for=\"threshold\">\"Profitable\" threshold<\u002Flabel>\n          <div class=\"row\">\n            <input type=\"range\" id=\"threshold\" min=\"0\" max=\"20\" step=\"1\" value=\"5\">\n            <span class=\"val\" id=\"thresholdVal\">5%<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"a-group\">\n        <p class=\"a-group-label\">Type size<\u002Fp>\n        <div class=\"a-field\">\n          <label for=\"typeSize\">Table text size<\u002Flabel>\n          <select id=\"typeSize\" class=\"type-size-select\">\n            <option value=\"0.8\">0.8em<\u002Foption>\n            <option value=\"0.9\">0.9em<\u002Foption>\n            <option value=\"1\" selected=\"\">1em<\u002Foption>\n            <option value=\"1.1\">1.1em<\u002Foption>\n            <option value=\"1.2\">1.2em<\u002Foption>\n            <option value=\"1.3\">1.3em<\u002Foption>\n            <option value=\"1.4\">1.4em<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function(){\n  const priceEl = document.getElementById('price');\n  const incomeEl = document.getElementById('income');\n  const downEl = document.getElementById('down');\n  const expenseEl = document.getElementById('expense');\n  const rateEl = document.getElementById('rate');\n  const termEl = document.getElementById('term');\n  const rangePctEl = document.getElementById('rangePct');\n  const stepsCountEl = document.getElementById('stepsCount');\n  const thresholdEl = document.getElementById('threshold');\n  const showYourInputsEl = document.getElementById('showYourInputs');\n  const typeSizeEl = document.getElementById('typeSize');\n  const mCoCSlider = document.getElementById('mCoCSlider');\n  const mCapSlider = document.getElementById('mCapSlider');\n  const mDscrSlider = document.getElementById('mDscrSlider');\n  const mCFSlider = document.getElementById('mCFSlider');\n\n  const downVal = document.getElementById('downVal');\n  const expenseVal = document.getElementById('expenseVal');\n  const rateVal = document.getElementById('rateVal');\n  const termVal = document.getElementById('termVal');\n  const incomePctVal = document.getElementById('incomePctVal');\n  const rangePctVal = document.getElementById('rangePctVal');\n  const stepsCountVal = document.getElementById('stepsCountVal');\n  const thresholdVal = document.getElementById('thresholdVal');\n\n  const drawer = document.getElementById('drawer');\n  const drawerToggle = document.getElementById('drawerToggle');\n\n  function applyTypeSize(){\n    const n = parseFloat(typeSizeEl.value);\n    document.getElementById('heatmap').style.fontSize = n + 'em';\n    document.querySelectorAll('.m-val').forEach(el => { el.style.fontSize = n + 'em'; });\n  }\n  typeSizeEl.addEventListener('change', applyTypeSize);\n  applyTypeSize();\n\n  drawerToggle.addEventListener('click', () => {\n    const expanded = drawer.classList.toggle('expanded');\n    drawer.classList.toggle('collapsed', !expanded);\n    drawerToggle.classList.toggle('expanded', expanded);\n    drawerToggle.setAttribute('aria-expanded', String(expanded));\n  });\n\n  function fmtMoney(n){\n    const sign = n < 0 ? '-' : '';\n    n = Math.abs(n);\n    return sign + '$' + Math.round(n).toLocaleString('en-US');\n  }\n  function fmtPct(n){\n    return (n>=0?'':'') + (n*100).toFixed(1) + '%';\n  }\n\n  function annualDebtService(loanAmount, ratePct, termYears){\n    const r = (ratePct/100)/12;\n    const n = termYears*12;\n    if(loanAmount<=0) return 0;\n    let monthly;\n    if(r === 0){\n      monthly = loanAmount/n;\n    } else {\n      monthly = loanAmount * r / (1 - Math.pow(1+r, -n));\n    }\n    return monthly*12;\n  }\n\n  function calc(price, income, downPct, expensePct, ratePct, termYears){\n    const noi = income * (1 - expensePct/100);\n    const downPayment = price * (downPct/100);\n    const loan = price - downPayment;\n    const ads = annualDebtService(loan, ratePct, termYears);\n    const cashFlow = noi - ads;\n    const coc = downPayment > 0 ? cashFlow/downPayment : (cashFlow>0?Infinity:-Infinity);\n    const capRate = price > 0 ? noi/price : 0;\n    const dscr = ads > 0 ? noi/ads : Infinity;\n    return {noi, downPayment, loan, ads, cashFlow, coc, capRate, dscr};\n  }\n\n  function verdictFor(coc, threshold){\n    if(coc >= threshold) return {label:'Profitable', cls:'profit'};\n    if(coc >= 0) return {label:'Marginal', cls:'amber'};\n    return {label:'Unprofitable', cls:'loss'};\n  }\n\n  function cellClass(coc, threshold){\n    if(coc >= threshold) return {bg:'var(--profit-bg)', fg:'var(--profit)'};\n    if(coc >= 0) return {bg:'var(--amber-bg)', fg:'var(--amber)'};\n    return {bg:'var(--loss-bg)', fg:'var(--loss)'};\n  }\n\n  function round(n, step){ return Math.round(n/step)*step; }\n\n  function render(){\n    const price = parseFloat(String(priceEl.value).replace(/,/g,'')) || 0;\n    const monthlyIncome = parseFloat(String(incomeEl.value).replace(/,/g,'')) || 0;\n    const income = monthlyIncome * 12; // annual income, directly entered\n    const incomePct = price > 0 ? (income/price)*100 : 0;\n    document.getElementById('incomeAnnualHint').textContent = `Annual: ${fmtMoney(income)}/yr`;\n\n    const downPct = parseFloat(downEl.value);\n    const expensePct = parseFloat(expenseEl.value);\n    const ratePct = parseFloat(rateEl.value);\n    const termYears = parseFloat(termEl.value);\n    const rangePct = parseFloat(rangePctEl.value);\n    const stepsCount = parseInt(stepsCountEl.value, 10);\n    const thresholdPct = parseFloat(thresholdEl.value);\n    const threshold = thresholdPct/100;\n\n    downVal.textContent = downPct + '%';\n    expenseVal.textContent = expensePct + '%';\n    rateVal.textContent = ratePct.toFixed(2) + '%';\n    termVal.textContent = termYears + ' yr';\n    incomePctVal.textContent = incomePct.toFixed(1) + '% of price / yr';\n    rangePctVal.textContent = rangePct + '%';\n    stepsCountVal.textContent = stepsCount;\n    thresholdVal.textContent = thresholdPct + '%';\n\n    mCoCSlider.value = downPct;\n    mCapSlider.value = expensePct;\n    mDscrSlider.value = ratePct;\n    mCFSlider.value = Math.round(monthlyIncome);\n\n    document.getElementById('legendMid').textContent = `0–${thresholdPct}% return`;\n    document.getElementById('legendHigh').textContent = `${thresholdPct}%+ return`;\n\n    // summary at exact inputs\n    const base = calc(price, income, downPct, expensePct, ratePct, termYears);\n    const v = verdictFor(base.coc, threshold);\n    document.getElementById('verdict').textContent = v.label;\n    document.getElementById('verdict').className = 'verdict ' + v.cls;\n    document.getElementById('mCoC').textContent = isFinite(base.coc) ? fmtPct(base.coc) : '—';\n    document.getElementById('mCap').textContent = fmtPct(base.capRate);\n    document.getElementById('mDscr').textContent = isFinite(base.dscr) ? base.dscr.toFixed(2)+'x' : '—';\n    document.getElementById('mCF').textContent = fmtMoney(base.cashFlow/12);\n\n    // grid: rows (price) x cols (monthly income), +/-rangePct in stepsCount increments per side\n    const stepSize = rangePct/stepsCount;\n    const steps = [];\n    for(let i=-stepsCount;i<=stepsCount;i++){ steps.push((i*stepSize)/100); }\n    const priceStepUnit = price > 200000 ? 5000 : 1000;\n    const monthlyStepUnit = monthlyIncome > 5000 ? 250 : 50;\n\n    const rows = steps.map(s => round(price*(1+s), priceStepUnit)).reverse(); // highest price at top\n    const cols = steps.map(s => round(monthlyIncome*(1+s), monthlyStepUnit)); // monthly income values\n\n    // precompute grid of coc values (convert monthly column to annual for the math)\n    const matrix = rows.map(rp => cols.map(ciMonthly => {\n      const c = calc(rp, ciMonthly*12, downPct, expensePct, ratePct, termYears);\n      return c.coc;\n    }));\n\n    let html = '<tr><td class=\"corner\"><\u002Ftd>';\n    html += `<td class=\"corner axis-label\" colspan=\"${cols.length}\" style=\"text-align:center;\">monthly income &rarr;<\u002Ftd><\u002Ftr>`;\n    html += '<tr><td class=\"corner\"><\u002Ftd>';\n    cols.forEach(c => { html += `<td class=\"col-head\">${fmtMoney(c)}<\u002Ftd>`; });\n    html += '<\u002Ftr>';\n\n    rows.forEach((rp, ri) => {\n      html += `<tr>`;\n      if(ri===0){\n        html += `<td class=\"row-head axis-label\" rowspan=\"${rows.length}\" style=\"writing-mode:vertical-rl;transform:rotate(180deg);vertical-align:middle;\">price &darr;<\u002Ftd>`;\n      }\n      html += `<td class=\"row-head\">${fmtMoney(rp)}<\u002Ftd>`;\n      cols.forEach((ciMonthly, colIdx) => {\n        const coc = matrix[ri][colIdx];\n        const style = cellClass(coc, threshold);\n        const isHit = showYourInputsEl.checked && (rp === round(price, priceStepUnit)) && (ciMonthly === round(monthlyIncome, monthlyStepUnit));\n        let cls = 'cell' + (isHit ? ' hit' : '');\n\n        if(ri>0){\n          const above = matrix[ri-1][colIdx];\n          if((above<0) !== (coc<0)) cls += ' break-top';\n        }\n        if(colIdx>0){\n          const left = matrix[ri][colIdx-1];\n          if((left<0) !== (coc<0)) cls += ' break-left';\n        }\n\n        html += `<td class=\"${cls}\" style=\"background:${style.bg};color:${style.fg};\">`+\n                 `<span class=\"cv\">${isFinite(coc)? (coc*100).toFixed(1)+'%' : '—'}<\u002Fspan><\u002Ftd>`;\n      });\n      html += `<\u002Ftr>`;\n    });\n\n    document.getElementById('heatmap').innerHTML = html;\n  }\n\n  mCoCSlider.addEventListener('input', () => { downEl.value = mCoCSlider.value; render(); });\n  mCapSlider.addEventListener('input', () => { expenseEl.value = mCapSlider.value; render(); });\n  mDscrSlider.addEventListener('input', () => { rateEl.value = mDscrSlider.value; render(); });\n  mCFSlider.addEventListener('input', () => { incomeEl.value = Number(mCFSlider.value).toLocaleString('en-US'); render(); });\n\n  [downEl, expenseEl, rateEl, termEl, rangePctEl, stepsCountEl, thresholdEl].forEach(el => {\n    el.addEventListener('input', render);\n  });\n  showYourInputsEl.addEventListener('change', render);\n\n  function formatWithCommas(el){\n    const raw = el.value;\n    const caret = el.selectionStart;\n    const digitsBeforeCaret = raw.slice(0, caret).replace(/[^\\d]/g, '').length;\n\n    const digitsOnly = raw.replace(/[^\\d]/g, '');\n    const numeric = digitsOnly === '' ? '' : String(parseInt(digitsOnly, 10));\n    const formatted = numeric === '' ? '' : Number(numeric).toLocaleString('en-US');\n\n    el.value = formatted;\n\n    let digitsSeen = 0, pos = 0;\n    while(pos < formatted.length && digitsSeen < digitsBeforeCaret){\n      if(/\\d/.test(formatted[pos])) digitsSeen++;\n      pos++;\n    }\n    el.setSelectionRange(pos, pos);\n  }\n\n  priceEl.addEventListener('input', () => { formatWithCommas(priceEl); render(); });\n  priceEl.addEventListener('blur', () => { if(priceEl.value.trim()==='') priceEl.value = '0'; });\n  incomeEl.addEventListener('input', () => { formatWithCommas(incomeEl); render(); });\n  incomeEl.addEventListener('blur', () => { if(incomeEl.value.trim()==='') incomeEl.value = '0'; });\n\n  render();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
